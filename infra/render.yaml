# Reference Blueprint: requires a paid worker and reachable Ollama-compatible open-model service.
# No paid resources are created by this file until the owner applies it in Render.
services:
  - type: web
    name: gigbid-web
    runtime: docker
    dockerfilePath: ./infra/docker/app.Dockerfile
    healthCheckPath: /api/health
    plan: starter
    envVars:
      - key: GIGBID_SECRET
        sync: false
      - key: OAUTH_ENCRYPTION_KEY
        sync: false
      - key: GIGBID_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: {name: gigbid-db, property: connectionString}
      - key: CHECKPOINT_DATABASE_URL
        fromDatabase: {name: gigbid-db, property: connectionString}
      - key: REDIS_URL
        fromService: {name: gigbid-queue, type: keyvalue, property: connectionString}
      - key: OLLAMA_URL
        sync: false
  - type: worker
    name: gigbid-worker
    runtime: docker
    dockerfilePath: ./infra/docker/app.Dockerfile
    dockerCommand: arq worker.settings.WorkerSettings
    plan: starter
    envVars:
      - key: GIGBID_SECRET
        sync: false
      - key: OAUTH_ENCRYPTION_KEY
        sync: false
      - key: GIGBID_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: {name: gigbid-db, property: connectionString}
      - key: CHECKPOINT_DATABASE_URL
        fromDatabase: {name: gigbid-db, property: connectionString}
      - key: REDIS_URL
        fromService: {name: gigbid-queue, type: keyvalue, property: connectionString}
      - key: OLLAMA_URL
        sync: false
  - type: keyvalue
    name: gigbid-queue
    plan: starter
    ipAllowList: []
databases:
  - name: gigbid-db
    plan: basic-256mb
