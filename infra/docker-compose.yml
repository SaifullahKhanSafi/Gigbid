name: gigbid
x-common: &common
  build:
    context: ..
    dockerfile: infra/docker/app.Dockerfile
  env_file: ../.env
  environment: &env
    GIGBID_ENV: production
    GIGBID_RUNTIME: /var/gigbid
    DATABASE_URL: postgresql://gigbid:${POSTGRES_PASSWORD:-local-compose-only-change-me}@postgres:5432/gigbid
    CHECKPOINT_DATABASE_URL: postgresql://gigbid:${POSTGRES_PASSWORD:-local-compose-only-change-me}@postgres:5432/gigbid
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    OLLAMA_URL: http://ollama:11434
    GIGBID_MCP_TRANSPORT: http
    PORTFOLIO_MCP_URL: http://portfolio:8101/mcp
    MARKETPLACE_MCP_URL: http://marketplace:8102/mcp
    WORKSPACE_MCP_URL: http://workspace:8103/mcp
    GIGBID_RERANKER_PATH: cross-encoder/ms-marco-MiniLM-L6-v2
    HF_HUB_OFFLINE: "0"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006/v1/traces
  volumes:
    - runtime:/var/gigbid
    - huggingface:/home/gigbid/.cache/huggingface
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  api:
    <<: *common
    ports: ["127.0.0.1:8000:8000"]
  web:
    image: nginx:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8080:80"]
    depends_on: [api]
  worker:
    <<: *common
    command: ["arq", "worker.settings.WorkerSettings"]
  portfolio:
    <<: *common
    environment:
      <<: *env
      MCP_HTTP: "1"
    command: ["python", "-m", "mcp_servers.portfolio.server"]
  marketplace:
    <<: *common
    environment:
      <<: *env
      MCP_HTTP: "1"
    command: ["python", "-m", "mcp_servers.marketplace.server"]
  workspace:
    <<: *common
    environment:
      <<: *env
      MCP_HTTP: "1"
    command: ["python", "-m", "mcp_servers.workspace.server"]
  gigsim:
    <<: *common
    command: ["python", "-m", "support.local_sim_health"]
    # This is a clearly labelled local fixture, not the missing official GigSim.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gigbid
      POSTGRES_DB: gigbid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-compose-only-change-me}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigbid"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.16.0
    volumes: ["qdrant:/qdrant/storage"]
  ollama:
    image: ollama/ollama:0.40.13
    volumes: ["ollama:/root/.ollama"]
    # Optional local NVIDIA acceleration: add `gpus: all` with a working NVIDIA container runtime.
  model-init:
    image: ollama/ollama:0.40.13
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 5; ollama pull qwen2.5:1.5b && ollama pull qwen2.5:7b-instruct"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on: [ollama]
  phoenix:
    image: arizephoenix/phoenix:version-12.13.0
    ports: ["127.0.0.1:6006:6006"]
    volumes: ["phoenix:/root/.phoenix"]
volumes:
  runtime:
  postgres:
  redis:
  qdrant:
  huggingface:
  ollama:
  phoenix:
