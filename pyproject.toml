[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigbid-copilot"
version = "0.1.0"
description = "Evidence-grounded freelancer copilot with durable human approvals"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "MIT"
dependencies = [
  "fastapi==0.163.1", "uvicorn==0.54.0", "pydantic==2.13.5",
  "langgraph==1.2.11", "langgraph-checkpoint-sqlite==3.1.3",
  "langgraph-checkpoint-postgres==3.2.1", "langchain-mcp-adapters==0.3.2",
  "mcp==1.30.0", "langchain-ollama==1.1.0", "langgraph-supervisor==0.0.31",
  "arq==0.28.0", "redis==5.3.1", "psycopg[binary,pool]==3.3.9",
  "qdrant-client==1.20.0", "sentence-transformers==6.0.0", "transformers==5.15.1",
  "numpy==2.5.3", "pandas==3.0.6", "scikit-learn==1.9.0", "rank-bm25==0.2.2",
  "httpx==0.28.1", "PyYAML==6.0.3", "python-dotenv==1.0.1", "requests==2.34.2", "torch==2.6.0",
  "cryptography==50.0.2", "PyJWT==2.15.1", "python-multipart==0.0.32", "pypdf==7.1.0",
  "psutil==7.2.2",
  "opentelemetry-sdk==1.45.0", "opentelemetry-exporter-otlp-proto-http==1.45.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.17.5", "reportlab==5.1.0", "pymupdf==2.1", "playwright==1.65.2", "matplotlib>=3.9,<4", "imageio-ffmpeg==0.8.1"]

[project.scripts]
gigbid-local = "scripts.start_local:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agent*", "rag*", "mcp_servers*", "apps.api*", "worker*", "scripts*", "evals*"]

[tool.setuptools.package-data]
agent = ["config.yaml", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error:async def functions are not natively supported"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["apps/web/node_modules", "runtime", "models", "apps/web/dist", "apps/web/playwright-report", "apps/web/test-results", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E731"]
